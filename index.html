<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Blob</title>
<style>
  :root {
    --bg: #dfe3ea;
    --ink: #2a2f3a;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    cursor: crosshair;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }
  .corner {
    position: fixed;
    z-index: 1;
    margin: 0;
    pointer-events: none;
    font-family: "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  .top-left {
    top: calc(24px + env(safe-area-inset-top, 0px));
    left: calc(28px + env(safe-area-inset-left, 0px));
  }
  .bottom-left {
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: calc(28px + env(safe-area-inset-left, 0px));
    max-width: 22rem;
  }
  .name {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .role {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    opacity: .45;
  }
  .label {
    margin: 0 0 6px;
    font-family: "Silkscreen", monospace;
    font-size: 11px;
    letter-spacing: .04em;
    opacity: .55;
  }
  .bottom-left p:not(.label) {
    margin: 0;
    font-size: 15px;
    line-height: 1.45;
  }
  .bottom-left .gap { margin-top: 14px; }
  .hint {
    position: fixed;
    right: calc(28px + env(safe-area-inset-right, 0px));
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    margin: 0;
    font-family: "Silkscreen", monospace;
    font-size: 31px;
    opacity: .5;
    pointer-events: none;
    z-index: 1;
  }

  .hint:hover{
    animation: blink 1s infinite;


  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;600&family=Silkscreen&display=swap">

<!-- Three.js 불러오기 (설치 없이 CDN에서) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>
<body>
<!-- 좌상단: 이름 + 하는 일 -->
<div class="corner top-left">
  <h1 class="name">Andrew Kim</h1>
  <p class="role">Communication Designer</p>
</div>

<!-- 좌하단: 짧은 소개 -->
<div class="corner bottom-left">
  <p class="label">About</p>
  <p>A designer creating interactions that break down the boundary between reality and graphics.</p>
  <p class="label gap">Location</p>
  <p>New York, NY</p>
  <p class="label gap">Studying</p>
  <p>BFA Communication Design, Parsons '29</p>
</div>

<p class="hint">Drag to spin</p>

<script type="module">
import * as THREE from 'three';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ───── 바꿔 보기 좋은 값들 ───── */
const MODEL_HEIGHT  = 2.6;          // 화면에 보일 모델 높이
const SMOOTH        = 0.05;     // 꿀렁임이 마우스를 따라가는 부드러움 (작을수록 은은함)
const PULL          = 0.07;     // 마우스 쪽으로 볼록해지는 정도
const BASE_WOBBLE   = 0.03;     // 기본 꿀렁임 (픽셀 형태 유지하려면 작게)
const EXTRA_WOBBLE  = 0.04;     // 마우스를 빨리 움직일 때 추가 꿀렁임
const AUTO_SPIN     = 0.004;    // 가만히 있을 때 저절로 도는 속도 (0이면 멈춤)
const DRAG_SPEED    = 0.008;    // 드래그로 돌릴 때 감도

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 1. 장면 · 카메라 · 렌더러 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3ea);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// 반사를 위한 환경 조명
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(3, 4, 5);
scene.add(light);

/* 2. 3D 파일 불러오기 */
const gltf = await new GLTFLoader().loadAsync('cursor.glb'); // 같은 폴더의 3D 파일
let model = null;
gltf.scene.traverse((o) => { if (o.isMesh && !model) model = o; });

const geo = model.geometry;
geo.center();                                   // 모델 중심을 가운데로
geo.computeBoundingBox();
const h = geo.boundingBox.max.y - geo.boundingBox.min.y;
geo.scale(MODEL_HEIGHT / h, MODEL_HEIGHT / h, MODEL_HEIGHT / h); // 크기 맞추기
const basePositions = geo.attributes.position.array.slice(); // 원래 위치 저장
const mat = model.material;                     // 파일에 들어 있는 색·질감 그대로 사용

const cursor = new THREE.Mesh(geo, mat);

// 회전용 그룹: 드래그하면 이 그룹이 360도 돌아감
const spinner = new THREE.Group();
spinner.add(cursor);
scene.add(spinner);

/* 3. 마우스 추적 */
const mouse = new THREE.Vector2(0, 0);       // 화면 기준 -1 ~ 1
const smoothMouse = new THREE.Vector2(0, 0); // 천천히 따라가는 마우스 값
let mouseSpeed = 0;

function onMove(e) {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  mouseSpeed += Math.hypot(x - mouse.x, y - mouse.y);
  mouse.set(x, y);
}
window.addEventListener('pointermove', onMove);
window.addEventListener('mousemove', onMove);

/* 3-1. 드래그로 360도 돌리기 */
let dragging = false;
let lastX = 0, lastY = 0;
const spinVel = new THREE.Vector2(0, 0); // 손을 놓아도 조금 더 도는 관성

renderer.domElement.style.cursor = 'grab';
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.style.cursor = 'grabbing';
  renderer.domElement.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  spinVel.set((e.clientX - lastX) * DRAG_SPEED, (e.clientY - lastY) * DRAG_SPEED);
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => {
  dragging = false;
  renderer.domElement.style.cursor = 'grab';
});

const axisY = new THREE.Vector3(0, 1, 0);
const axisX = new THREE.Vector3(1, 0, 0);
const qStep = new THREE.Quaternion();
function rotateBy(dx, dy) {
  // 화면 기준으로 돌려서 어느 방향이든 자연스럽게 360도 회전
  qStep.setFromAxisAngle(axisY, dx);
  spinner.quaternion.premultiply(qStep);
  qStep.setFromAxisAngle(axisX, dy);
  spinner.quaternion.premultiply(qStep);
}

/* 4. 매 프레임 움직이기 */
const noise = new SimplexNoise();
const pos = geo.attributes.position;
const v = new THREE.Vector3();
const dir = new THREE.Vector3();
const pullDir = new THREE.Vector3();
const invQuat = new THREE.Quaternion();
const clock = new THREE.Clock();
let energy = 0;

function tick() {
  const t = clock.getElapsedTime() * (reduceMotion ? 0.3 : 1);

  // 마우스 값을 천천히 따라가게 해서 은은하게
  smoothMouse.lerp(mouse, SMOOTH);

  // 마우스 속도 → 꿀렁임 에너지 (천천히 줄어듦)
  energy += (Math.min(mouseSpeed * 3, 1) - energy) * 0.05;
  mouseSpeed *= 0.85;
  const amp = BASE_WOBBLE + (reduceMotion ? 0 : energy * EXTRA_WOBBLE);

  // 마우스 방향을 모델의 회전에 맞춰 바꾸기
  pullDir.set(smoothMouse.x * 1.6, smoothMouse.y * 1.6, 1).normalize();
  cursor.getWorldQuaternion(invQuat).invert();
  pullDir.applyQuaternion(invQuat);
  const pullAmount = Math.min(smoothMouse.length(), 1) * PULL;

  // 노이즈 무늬도 마우스 쪽으로 살짝 흘러가게
  const ox = smoothMouse.x * 0.6, oy = smoothMouse.y * 0.6;

  for (let i = 0; i < pos.count; i++) {
    v.fromArray(basePositions, i * 3);
    dir.copy(v).normalize();

    // ① 노이즈로 꿀렁임
    const n = noise.noise4d(v.x * 1.4 - ox, v.y * 1.4 - oy, v.z * 1.4, t * 0.4);

    // ② 마우스 쪽 부분만 볼록하게
    const facing = Math.max(0, dir.dot(pullDir));
    const bulge = facing * facing * facing * pullAmount;

    v.multiplyScalar(1 + n * amp + bulge);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;

  // 회전: 드래그 중이면 드래그만큼, 놓으면 관성으로 서서히 멈추고 다시 천천히 자동 회전
  rotateBy(spinVel.x, spinVel.y);
  if (!dragging) {
    spinVel.multiplyScalar(0.95);
    if (spinVel.length() < AUTO_SPIN && !reduceMotion) rotateBy(AUTO_SPIN, 0);
  } else {
    spinVel.multiplyScalar(0.5); // 드래그 중 멈춰 있으면 같이 멈춤
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

/* 5. 창 크기 바뀌면 맞추기 */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
